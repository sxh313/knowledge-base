name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        run: |
          $logFile = Join-Path $env:RUNNER_TEMP 'windows-build.log'
          npm run exe 2>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) {
            Get-Content $logFile -Tail 60 | ForEach-Object {
              $line = $_ -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Output "::error::$line"
            }
            exit $LASTEXITCODE
          }
          if (-not (Test-Path "$env:RUNNER_TEMP\kb-release\*.exe")) {
            throw 'Windows installer was not generated.'
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-base-windows
          path: |
            ${{ runner.temp }}/kb-release/*.exe
            ${{ runner.temp }}/kb-release/*.blockmap

      - name: Publish Windows installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/kb-release/*.exe
            ${{ runner.temp }}/kb-release/*.blockmap
          draft: false
          prerelease: false
