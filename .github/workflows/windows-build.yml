name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        run: |
          npx tsc -b
          $env:BUILD_TARGET = 'electron'
          npx vite build
          npx electron-builder --win --config.directories.output="$env:RUNNER_TEMP\kb-release"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-base-windows
          path: |
            ${{ runner.temp }}/kb-release/*.exe
            ${{ runner.temp }}/kb-release/*.blockmap

      - name: Publish Windows installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/kb-release/*.exe
            ${{ runner.temp }}/kb-release/*.blockmap
          draft: false
          prerelease: false
