name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject sync configuration
        shell: pwsh
        run: |
          "VITE_SYNC_TOKEN=${{ secrets.VITE_SYNC_TOKEN }}" | Add-Content .env.local
          "VITE_SYNC_OWNER=${{ secrets.VITE_SYNC_OWNER || 'sxh313' }}" | Add-Content .env.local
          "VITE_SYNC_REPO=${{ secrets.VITE_SYNC_REPO || 'knowledge-base' }}" | Add-Content .env.local
          "VITE_SYNC_BRANCH=${{ secrets.VITE_SYNC_BRANCH || 'knowledge-base' }}" | Add-Content .env.local

      - name: Build Windows installer
        id: package
        continue-on-error: true
        shell: pwsh
        run: |
          $logFile = Join-Path $env:RUNNER_TEMP 'windows-build.log'
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          npm run exe 2>&1 | Tee-Object -FilePath $logFile
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0 -and (-not (Test-Path "$env:RUNNER_TEMP\kb-release\*.exe") -or -not (Test-Path "$env:RUNNER_TEMP\kb-release\latest.yml"))) {
            'Windows installer or latest.yml was not generated.' | Add-Content $logFile
            $exitCode = 1
          }
          exit $exitCode

      - name: Report packaging failure
        if: steps.package.outcome == 'failure'
        shell: pwsh
        run: |
          $logFile = Join-Path $env:RUNNER_TEMP 'windows-build.log'
          if (Test-Path $logFile) {
            Get-Content $logFile -Tail 80 | ForEach-Object {
              $line = $_ -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Output "::error::$line"
            }
          }
          throw 'Windows installer packaging failed; see annotations above.'

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-base-windows
          path: |
            ${{ runner.temp }}/kb-release/*.exe
            ${{ runner.temp }}/kb-release/*.blockmap
            ${{ runner.temp }}/kb-release/latest.yml

      - name: Publish Windows installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/kb-release/*.exe
            ${{ runner.temp }}/kb-release/*.blockmap
            ${{ runner.temp }}/kb-release/latest.yml
          draft: false
          prerelease: false
