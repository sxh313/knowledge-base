name: Android Build

on:
  workflow_dispatch:        # 手动触发: Actions 页点 Run workflow
  push:
    tags:
      - 'v*'               # 打 tag 时自动构建

jobs:
  build-android:
    name: 构建安卓 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 允许上传到 Releases

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK 缓存
        uses: android-actions/setup-android@v3

      - name: 构建 Web + 同步 Capacitor
        env:
          BUILD_TARGET: android
        run: |
          npx vite build
          npx cap sync android

      - name: 构建 Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: 构建 Release APK(未签名)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-base-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

      # 若由 tag 触发,发布到 GitHub Releases
      - name: 发布 APK 到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false